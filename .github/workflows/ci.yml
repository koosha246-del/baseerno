name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint, TypeCheck, Test, Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bayan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis for the shared multi-instance rate-limit integration tests.
      # REDIS_URL is set ONLY on the dedicated step below (not job-level):
      # route tests (login/register/checkout) assert in-memory rate-limit
      # semantics, so the whole suite must keep running without REDIS_URL.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bayan_test
      AUTH_SECRET: ci-test-secret-min-32-chars-long-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: "بصیر نو"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Redis rate-limit integration tests
        # Proves the AUTH rate limit is shared across app instances via
        # real Redis (src/lib/__tests__/integration/rate-limit-redis.integration.test.ts).
        # REDIS_URL is scoped to this step so the rest of the suite keeps
        # its in-memory rate-limit semantics.
        run: npx vitest run src/lib/__tests__/integration/rate-limit-redis.integration.test.ts
        env:
          REDIS_URL: redis://localhost:6379

      - name: Replica fault-injection drill
        # Proves runOnReplica falls back to primary when the replica is
        # unreachable — runs against the Postgres service (primary) with a
        # forced dead REPLICA_URL (see scripts/fault-inject-replica.ts).
        run: npm run drill:replica

      - name: Coverage gate
        run: npx vitest run --coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bayan_test

      - name: Migration safety (migrate deploy on empty DB)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bayan_test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bayan_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bayan_e2e
      AUTH_SECRET: ci-e2e-secret-min-32-chars-long-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: "بصیر نو"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Run E2E tests
        # Playwright's webServer config (playwright.config.ts) starts
        # `next start` and waits for it — no manual background + wait-on.
        run: npx playwright test
