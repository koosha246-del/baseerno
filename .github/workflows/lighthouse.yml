# ──────────────────────────────────────────────────────────────────
# Lighthouse CI — automated performance, accessibility, and SEO
# audits on every push to main + daily schedule.
#
# Runs Lighthouse against the local dev server and posts results
# as a PR comment via temporary public storage.
# ──────────────────────────────────────────────────────────────────

name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/baseerno' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-build-insecure-secret-min-32-chars-long!!' }}
          PAYMENT_SIGNATURE_SECRET: ${{ secrets.PAYMENT_SIGNATURE_SECRET || 'ci-build-payment-secret' }}

      - name: Start Next.js server
        run: |
          npx next start -p 3000 &
          sleep 5
          echo "Server started on port 3000"

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/courses
            http://localhost:3000/library
            http://localhost:3000/login
            http://localhost:3000/register
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./lighthouserc.json

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
