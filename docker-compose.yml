version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bayan-bartar
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      PAYMENT_SIGNATURE_SECRET: ${PAYMENT_SIGNATURE_SECRET:?PAYMENT_SIGNATURE_SECRET must be set}
      DIRECT_URL: ${DIRECT_URL:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SEARCH_HOST: ${SEARCH_HOST:-http://meilisearch:7700}
      SEARCH_API_KEY: ${SEARCH_API_KEY}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: bayan-worker
    restart: unless-stopped
    command: npm run worker:email
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      PAYMENT_SIGNATURE_SECRET: ${PAYMENT_SIGNATURE_SECRET:?PAYMENT_SIGNATURE_SECRET must be set}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      REDIS_URL: ${REDIS_URL:-}
    depends_on:
      db:
        condition: service_healthy

  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: bayan-meili
    restart: unless-stopped
    environment:
      # Required — no built-in default. A hardcoded master key would leave
      # the search index unauthenticated for anyone on the same network.
      MEILI_MASTER_KEY: ${SEARCH_API_KEY:?SEARCH_API_KEY must be set}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  db:
    image: postgres:16-alpine
    container_name: bayan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-baseerno}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  meili_data:
    driver: local
